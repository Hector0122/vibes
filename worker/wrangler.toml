# Vibes personal cloud backend. Setup: see README.md.
name = "vibes-cloud"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[vars]
R2_BUCKET_NAME = "vibes"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "vibes"

[[d1_databases]]
binding = "DB"
database_name = "vibes"
database_id = "ecc5b4e3-829a-4fee-8e85-9b2de2760a85"
migrations_dir = "migrations"

# Secrets (wrangler secret put <NAME>), never in this file:
#   API_TOKEN             your personal bearer token
#   R2_ACCOUNT_ID         Cloudflare account id (for the S3 endpoint)
#   R2_ACCESS_KEY_ID      R2 API token access key (Object Read & Write on "vibes")
#   R2_SECRET_ACCESS_KEY  R2 API token secret
#   PODCASTINDEX_KEY      Podcast Index API key (free, api.podcastindex.org), for Podcasts
#   PODCASTINDEX_SECRET   Podcast Index API secret
