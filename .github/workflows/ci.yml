# Runs only when publishing a version (like Vaulta): every test level (Worker
# integration tests, the phone app's typecheck + Jest, desktop unit/integration
# tests and the E2E flow against the built app), then the installers, then the
# GitHub Release. Nothing runs on ordinary pushes or pull requests.
name: CI

on:
  push:
    tags: ['v*'] # a version tag (v1.1.0), or a release created on GitHub with a new tag
  # Publish from GitHub (also from the phone): Actions → CI → Run workflow, on main,
  # with the version in package.json. Creates the tag and the release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (la de package.json, p. ej. 1.1.0)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            worker/pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      # Root deps first: the Worker imports src/shared/api.ts, and compiling it reads the root
      # tsconfig.json, which extends @electron-toolkit/tsconfig (a root dependency).
      - run: pnpm install --frozen-lockfile

      - name: Worker
        working-directory: worker
        run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test

      # The phone app's client-vs-Worker tests run here too; compiling them reads mobile/tsconfig.json (expo).
      - name: Mobile deps
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - run: pnpm test
      - run: xvfb-run -a pnpm test:e2e

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from the root package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Installers, built only when the tests pass. Download them from the run's "Artifacts".
  desktop-installers:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: vibes-linux
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  android-apk:
    needs: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      # Generates android/ from app.json (it is never committed).
      - run: npx expo prebuild --platform android --no-install
      # Release build signed with the debug key: installable by hand, not for the Play Store.
      # arm64 for phones, x86_64 for Waydroid / emulators.
      - run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: mobile/android
      - run: mv android/app/build/outputs/apk/release/app-release.apk vibes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vibes-android
          path: mobile/vibes.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [desktop-installers, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG="v${INPUT_VERSION#v}"
            # The installers carry the version in package.json / app.json: they must match.
            for f in package.json mobile/app.json; do
              grep -q "\"version\": \"${TAG#v}\"" "$f" || { echo "::error::$f no dice la versión ${TAG#v}"; exit 1; }
            done
          else
            TAG="$GITHUB_REF_NAME"
          fi
          mv out/vibes-android/vibes.apk "out/vibes-${TAG#v}.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber out/vibes-linux/* out/*.apk
          else
            # --target creates the tag when publishing from "Run workflow".
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vibes $TAG" \
              --notes "Escritorio (Linux): instala el .deb con sudo apt install ./vibes_*.deb, o usa el AppImage. Celular (Android): instala el .apk (permite apps de fuentes desconocidas); también corre en Waydroid." \
              out/vibes-linux/* out/*.apk
          fi
