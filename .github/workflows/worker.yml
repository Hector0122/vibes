# Deploys the cloud Worker (D1 migrations + code) whenever it changes on main,
# so it never has to be done by hand from a computer. Also runnable by hand:
# GitHub → Actions → "Desplegar nube" → Run workflow (works from the phone).
# Needs the repo secret CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"
# + Account → D1 → Edit). Optional: CLOUDFLARE_ACCOUNT_ID if the token sees
# more than one account. The Worker's own secrets (API_TOKEN, R2 keys) stay
# in Cloudflare and are not touched.
name: Desplegar nube

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'src/shared/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Falta el token de Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::No se desplegó: agrega el secreto CLOUDFLARE_API_TOKEN en Settings → Secrets and variables → Actions."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            worker/pnpm-lock.yaml
      # Root deps: compiling the Worker reads src/shared through the root tsconfig.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - name: Pruebas del Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test
      - name: Migraciones (D1)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: pnpm exec wrangler d1 migrations apply vibes --remote
      - name: Desplegar
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: pnpm exec wrangler deploy
